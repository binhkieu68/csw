# ============================================================
# DEFAULT: H2 in-memory database (zero setup, works immediately)
# ============================================================
spring.datasource.url=jdbc:h2:mem:fptdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 web console (browse the DB in a browser) -> http://localhost:8080/h2-console
# JDBC URL to use in the console login screen: jdbc:h2:mem:fptdb
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ============================================================
# TO USE MYSQL INSTEAD: comment out the H2 block above and
# uncomment the block below (create the database first:
# CREATE DATABASE fptdb;)
# ============================================================
# spring.datasource.url=jdbc:mysql://localhost:3306/fptdb?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
# spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=YOUR_MYSQL_PASSWORD
# spring.jpa.hibernate.ddl-auto=update
# spring.jpa.show-sql=true
# spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

server.port=8080
